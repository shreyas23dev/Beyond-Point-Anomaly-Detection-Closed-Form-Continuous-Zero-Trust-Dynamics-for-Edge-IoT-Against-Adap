version: '3.8'

services:
  trust_engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: dynamic-trust-engine:latest
    container_name: dynamic-trust-engine
    ports:
      - "8000:8000"
    volumes:
      - ../data:/app/data
      - ../logs:/app/logs
      - ../artifacts:/app/artifacts
      - ../config:/app/config:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
