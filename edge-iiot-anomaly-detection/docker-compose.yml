version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: edge-iiot-api:latest
    container_name: edge-iiot-api
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./artifacts:/app/artifacts:ro
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=8000
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
